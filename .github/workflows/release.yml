name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: >
          python -m py_compile
          scripts/extract_release_notes.py
          scripts/install_student_os.py
          scripts/run_smoke_tests.py
          student-os/scripts/update_student_os.py

      - name: Run smoke tests
        run: python scripts/run_smoke_tests.py

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must look like vX.Y.Z, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: >
          python scripts/extract_release_notes.py
          --version "${{ steps.version.outputs.version }}"
          --output release-notes.md

      - name: Fail if GitHub Release already exists
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "error: GitHub Release for $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi

      - name: Create GitHub Release
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          --title "${{ steps.version.outputs.tag }}"
          --notes-file release-notes.md
